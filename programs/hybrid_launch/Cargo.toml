[package]
name = "hybrid_launch"
version = "0.1.0"
description = "Track A (SPL-404): classic SPL Token launch with fixed 1B supply and immutable LaunchConfig. Engine-independent. Devnet/localnet only."
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "hybrid_launch"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
# Mainnet build: refuses to compile until PLATFORM_FEE_OWNER is Barton's Squads vault (constants.rs).
mainnet = ["mainnet-beta"]
# MAINNET BETA (ADR-021): compile out every instruction not shipped in the beta. `mainnet` implies it.
# Each piece is separate so Barton can re-enable one by editing this list (a program upgrade).
mainnet-beta = ["no-native-launch", "no-burn-mode", "no-tax-raffle"]
# Native (non-DBC) launch / launch_plain / launch_burn: supply is locked in a PDA nothing signs for (QA-MOD-04).
no-native-launch = []
# Mode 3 (burn hybrid): launch_burn, register_burn_dbc. NFTs mint in a known sequential order (ADR-020 open item).
no-burn-mode = []
# Modes 4/5 (tax, raffle; SHELVED by ADR-020): launch_token22, launch_raffle, buy_inventory.
no-tax-raffle = []
# DEVNET E2E ONLY: lowers MIN_GRADUATION_THRESHOLD_LAMPORTS to 0.1 SOL (needs_barton.rs). Never in
# target/deploy, never with `mainnet` (compile_error).
devnet-e2e = []
# Token-2022 is linked only so Mode 4 (`launch_token22`) can create an extensionless mint.
# Modes 1–3 still type their mint and token program as classic SPL and reject Token-2022.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.0"
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "token_2022", "associated_token"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
