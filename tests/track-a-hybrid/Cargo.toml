[package]
name = "track-a-hybrid-tests"
version = "0.1.0"
description = "Track A (SPL-404) LiteSVM tests. Localnet only; runs the real SBF binaries from target/deploy."
edition.workspace = true
rust-version.workspace = true
publish = false
# Every test binary is listed explicitly below (engineer + QA). autotests is off only so QA's
# tests/qa_launch.rs shim doesn't build the same QA file twice; QA files are NOT dropped.
autotests = false

[lib]
path = "lib.rs"

[[test]]
name = "launch"
path = "launch/launch.rs"

[[test]]
name = "vault"
path = "vault/vault.rs"

[[test]]
name = "vault_real_switchboard"
path = "vault/real_switchboard.rs"

[[test]]
name = "vault_dbc_graduation"
path = "vault/dbc_graduation.rs"

# QA-owned test files (contents not edited by the engineer).
[[test]]
name = "qa_launch"
path = "launch/qa_launch.rs"

# QA's regression suite (ported to the current harness by QA); runs by default.
[[test]]
name = "qa_regression"
path = "qa-roots/qa_regression.rs"

[features]
qa-regression = []

[dev-dependencies]
anchor-lang = "=1.2.0"
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "associated_token"] }
hybrid_launch = { path = "../../programs/hybrid_launch", features = ["no-entrypoint"] }
hybrid_vault = { path = "../../programs/hybrid_vault", features = ["no-entrypoint"] }
mock-switchboard = { path = "mock-switchboard" }
mpl-core = "=0.12.1"
litesvm = "=0.10.0"
solana-account = "3.4.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
serde_json = "1"
